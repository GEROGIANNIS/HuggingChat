<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hugging Face API Tester</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            background-color: #f8f9fa;
        }
        textarea {
            width: 100%;
            height: 120px;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .chat-message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 80%;
            position: relative;
        }
        .user-message {
            background-color: #e3f2fd;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        .bot-message {
            background-color: #f1f1f1;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }
        .chat-container {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fff;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
        }
        .model-selector {
            margin-bottom: 20px;
        }
        .loading {
            text-align: center;
            display: none;
            margin: 20px 0;
        }
        .loading-spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 0.25rem solid rgba(0,0,0,0.1);
            border-right-color: #007bff;
            border-radius: 50%;
            animation: spinner-border .75s linear infinite;
        }
        @keyframes spinner-border {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center">🤖 AI Chat Assistant</h1>
    
    <div class="form-group model-selector">
        <label for="model">Select AI Model:</label>
        <select class="form-control" name="model" id="model">
            <option value="mistralai/Mistral-7B-Instruct-v0.1" selected>Mistral 7B Instruct</option>
            <option value="meta-llama/Llama-2-7b-chat-hf">Llama 2 7B Chat</option>
            <option value="google/gemma-7b-it">Gemma 7B</option>
            <option value="tiiuae/falcon-7b-instruct">Falcon 7B Instruct</option>
            <option value="distilbert/distilgpt2">DistilGPT2 (small)</option>
            <option value="google/flan-t5-small">Flan-T5-Small (QA/Instruction)</option>
            <option value="tiiuae/falcon-rw-1b">Falcon RW 1B (Text Generation)</option>
        </select>
    </div>
    <div class="form-group">
        <label for="inputs">Your message:</label>
        <textarea class="form-control" name="inputs" id="inputs" placeholder="Enter your message here...">What is 1+1?</textarea>
    </div>
    <button id="send-btn" class="btn btn-primary btn-block">Send Message</button>

    <div class="loading">
        <div class="loading-spinner"></div>
        <p>Getting response...</p>
    </div>

    <div class="chat-container" id="chat-container">
        {% if user_input %}
        <div class="chat-message user-message">
            <strong>You:</strong><br>
            {{ user_input }}
        </div>
        {% endif %}
        
        {% if response %}
        <div class="chat-message bot-message">
            <strong>AI:</strong><br>
            {{ response }}
        </div>
        {% endif %}
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    $(document).ready(function() {
        // Handle form submission without page reload
        $('#send-btn').click(function(e) {
            e.preventDefault();
            
            const userInput = $('#inputs').val().trim();
            if (userInput === '') return;
            
            const selectedModel = $('#model').val();
            
            // Add user message to chat
            appendMessage('You', userInput, 'user-message');
            
            // Show loading spinner
            $('.loading').show();
            
            // Clear input
            $('#inputs').val('');
            
            // Send AJAX request
            $.ajax({
                url: '/query',
                type: 'POST',
                data: {
                    inputs: userInput,
                    model: selectedModel
                },
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                },
                success: function(data) {
                    // Hide loading spinner
                    $('.loading').hide();
                    
                    // Add AI response to chat
                    appendMessage('AI', data.response, 'bot-message');
                },
                error: function(xhr, status, error) {
                    // Hide loading spinner
                    $('.loading').hide();
                    
                    // Show error message
                    appendMessage('System', 'Error: ' + error, 'bot-message');
                }
            });
        });
        
        // Function to append a message to the chat container
        function appendMessage(sender, message, className) {
            const messageHtml = `
                <div class="chat-message ${className}">
                    <strong>${sender}:</strong><br>
                    ${message}
                </div>
            `;
            $('#chat-container').append(messageHtml);
            
            // Scroll to bottom of chat container
            const chatContainer = document.getElementById('chat-container');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    });
</script>

</body>
</html>
